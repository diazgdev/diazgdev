<svg xmlns="http://www.w3.org/2000/svg" width="360" height="318" viewBox="0 0 360 318" role="img"><title>~/about.md</title><style>text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style><rect width="360" height="318" rx="14" fill="#1a1b26"/><g opacity=".55"><circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="36" cy="20" r="5" fill="#febc2e"/><circle cx="52" cy="20" r="5" fill="#28c840"/></g><text x="130" y="24" fill="#9aa5ce" font-size="10">~/about.md</text><text x="24" y="65" fill="#7aa2f7" font-size="13">$</text><text x="42" y="65" fill="#c0caf5" font-size="13">cat ~/about.md</text><text x="24" y="102" fill="#7aa2f7" font-size="13">Hi, I&#x27;m Guillermo Díaz</text><text x="24" y="134" fill="#c0caf5" font-size="13">I work on lead management software,</text><text x="24" y="154" fill="#c0caf5" font-size="13">college search websites, and tools for</text><text x="24" y="174" fill="#c0caf5" font-size="13">teams. I build APIs and dashboards and</text><text x="24" y="194" fill="#c0caf5" font-size="13">connect services.</text><text x="24" y="228" fill="#c0caf5" font-size="13">Outside work, I make small macOS apps</text><text x="24" y="248" fill="#c0caf5" font-size="13">and a learning game for my kids.</text><text x="24" y="290" fill="#7aa2f7" font-size="13">$</text><text x="42" y="290" fill="#c0caf5" font-size="13"></text></svg>