<svg xmlns="http://www.w3.org/2000/svg" width="800" height="158" viewBox="0 0 800 158" font-size="13"><title>Thanks for visiting.</title>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; dominant-baseline: middle; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect width="100%" height="100%" fill="#1a1b26" rx="14" ry="14" />
  <g opacity="0.5">
    <circle cx="24" cy="24" r="6" fill="#ff5f57" />
    <circle cx="44" cy="24" r="6" fill="#febc2e" />
    <circle cx="64" cy="24" r="6" fill="#28c840" />
  </g>
  <text x="400" y="28" fill="#9aa5ce" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">~ / signoff</text>
  <g transform="translate(40 62)"><text fill="#7aa2f7">$</text><text x="20" fill="#c0caf5">logout</text></g>
  <g transform="translate(40 84)"><text fill="#9aa5ce">[ </text><text x="14" fill="#7aa2f7">session.end</text><text x="100" fill="#9aa5ce"> ]:</text><text x="128" font-size="13" fill="#c0caf5">Thanks for visiting.</text></g>
  <g transform="translate(40 128)"><text fill="#7aa2f7">$</text><rect x="20" y="-7" width="9" height="14" fill="#c0caf5" style="animation: blink 1s steps(1) infinite" /></g>

  <text x="782" y="144" fill="#9aa5ce" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="10" text-anchor="end"># made with ryme.md</text>
</svg>
